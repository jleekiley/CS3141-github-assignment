name: Run Java Program
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  run-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
       # CI
      - name: Compile
        run: javac Test.java
      - name: Run
        run: java Test
        # CD
      - name: Create JAR
        run: jar --create --file Test.jar Test.class

      - name: Deliver application
        uses: actions/upload-artifact@v4
        with:
          name: Test-App
          path: Test.jar
